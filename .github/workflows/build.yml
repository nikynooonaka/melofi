name: Build APK Melofi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Build APK inside Docker (kivy/buildozer)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            kivy/buildozer:latest \
            bash -c "yes | buildozer android debug 2>&1"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melofi-APK
          path: ${{ github.workspace }}/bin/*.apk
          retention-days: 30
