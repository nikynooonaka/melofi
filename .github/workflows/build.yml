name: Build APK Melofi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer + deps
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            git zip unzip wget curl \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev ccache python3-pip python3-dev python3-venv \
            libjpeg-dev libpng-dev
            
          pip3 install --upgrade pip setuptools wheel virtualenv
          pip3 install cython buildozer
          echo "✅ Done installing"

      - name: Build APK
        run: |
          buildozer android debug 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Melofi-APK
          path: bin/*.apk
          retention-days: 30
