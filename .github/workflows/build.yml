name: Build APK Melofi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies (Buildozer + Android SDK)
        run: |
          sudo apt update -qq
          sudo apt install -y -qq \
            git zip unzip wget curl \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            libltdl-dev libltdl7 \
            ccache libxcrypt-dev
          echo "✅ System deps done"

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==3.0.11
          echo "✅ Python deps done"

      - name: Build APK with Buildozer
        run: |
          buildozer android debug 2>&1
        shell: bash

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Melofi-APK
          path: bin/*.apk
          retention-days: 30
